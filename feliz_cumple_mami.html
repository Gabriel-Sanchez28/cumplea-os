<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños, Mami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFF6F1;
    --blush: #FFD9DF;
    --blush-deep: #FFC1CC;
    --rose-red: #C81D3D;
    --rose-red-dark: #7A1030;
    --rose-pink: #FF6B81;
    --deep-wine: #6E1830;
    --paper: rgba(255,250,247,0.82);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    background: radial-gradient(circle at 20% 15%, #FFEDEF 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, #FFE1E6 0%, transparent 50%),
                linear-gradient(160deg, var(--cream) 0%, var(--blush) 55%, var(--blush-deep) 100%);
    font-family: 'Cormorant Garamond', serif;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding: 40px 16px;
  }

  /* Tarjeta central */
  .card{
    position:relative;
    z-index:2;
    max-width: 620px;
    width:100%;
    background: var(--paper);
    border-radius: 28px;
    padding: 48px 40px 36px;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(122, 16, 48, 0.35);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.6);
    opacity:0;
    transform: translateY(18px);
    animation: aparecer 1.1s ease-out 0.15s forwards;
  }

  @keyframes aparecer{
    to{ opacity:1; transform: translateY(0); }
  }

  h1.titulo{
    font-family:'Great Vibes', cursive;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    color: var(--deep-wine);
    margin: 6px 0 0;
    line-height:1;
    text-shadow: 0 2px 10px rgba(200,29,61,0.2);
  }

  .subtitulo{
    font-family:'Great Vibes', cursive;
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    color: var(--rose-red-dark);
    margin: 4px 0 22px;
  }

  .leyenda{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    line-height: 1.7;
    color: #5a2233;
    max-width: 460px;
    margin: 0 auto 30px;
  }

  .leyenda strong{
    font-style: normal;
    color: var(--rose-red-dark);
  }

  .firma{
    font-family:'Great Vibes', cursive;
    font-size: 1.6rem;
    color: var(--rose-red-dark);
    margin-top: -6px;
  }

  /* Pantalla del sobre */
  .envelope-screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 22px;
    background: radial-gradient(circle at 20% 15%, #FFEDEF 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, #FFE1E6 0%, transparent 50%),
                linear-gradient(160deg, var(--cream) 0%, var(--blush) 55%, var(--blush-deep) 100%);
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  .envelope-screen.oculto{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  .envelope{
    position:relative;
    width: min(280px, 70vw);
    height: min(190px, 48vw);
    cursor:pointer;
    filter: drop-shadow(0 18px 30px rgba(122,16,48,0.3));
    animation: flotar 3s ease-in-out infinite;
  }

  @keyframes flotar{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }

  .envelope .cuerpo{
    position:absolute;
    inset:0;
    background: linear-gradient(160deg, #FFF6F1 0%, #FFE1E6 100%);
    border-radius: 10px;
    border: 2px solid #FFC1CC;
  }

  .envelope .solapa{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 95px solid #FFC1CC;
    transform-origin: top center;
    transition: transform 0.6s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 4px 6px rgba(122,16,48,0.15));
  }

  .envelope.abierto .solapa{
    transform: rotateX(180deg);
  }

  .envelope .sello{
    position:absolute;
    top: 46%;
    left:50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    z-index:3;
    filter: drop-shadow(0 3px 6px rgba(122,16,48,0.35));
    transition: opacity 0.3s ease;
  }

  .envelope.abierto .sello{
    opacity:0;
  }

  .envelope .carta-asomo{
    position:absolute;
    left:8%;
    right:8%;
    bottom:6%;
    height:0;
    background: #FFFDFB;
    border-radius: 6px 6px 0 0;
    box-shadow: 0 -2px 8px rgba(122,16,48,0.15);
    transition: height 0.5s ease 0.3s;
  }

  .envelope.abierto .carta-asomo{
    height: 55%;
  }

  .toca-texto{
    font-family:'Great Vibes', cursive;
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    color: var(--rose-red-dark);
    text-align:center;
    animation: pulso-suave 1.8s ease-in-out infinite;
  }

  @keyframes pulso-suave{
    0%, 100%{ opacity:0.7; }
    50%{ opacity:1; }
  }

  /* Botón de música flotante */
  .music-toggle{
    position:fixed;
    bottom: 18px;
    right: 18px;
    z-index: 50;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 8px 18px -6px rgba(122,16,48,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 20px;
    cursor:pointer;
    opacity:0;
    transition: opacity 0.5s ease, transform 0.2s ease;
  }

  .music-toggle.visible{
    opacity:1;
  }

  .main-content{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform: translateY(14px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events:none;
  }

  .main-content.visible{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
  }
</style>
</head>
<body>

<!-- Pantalla del sobre -->
<div class="envelope-screen" id="envelopeScreen">
  <div class="envelope" id="envelope" onclick="abrirSobre()">
    <div class="carta-asomo"></div>
    <div class="cuerpo"></div>
    <div class="solapa"></div>
    <svg class="sello" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <path d="M50,84 C8,54 -6,22 20,8 C36,-1 50,10 50,26 C50,10 64,-1 80,8 C106,22 92,54 50,84 Z" fill="#FF6B81"/>
    </svg>
  </div>
  <p class="toca-texto">Toca el sobre para abrir tu regalo 💌</p>
</div>

<!-- Audio con tu archivo local exacto -->
<audio id="backgroundAudio" loop preload="auto">
  <source src="Cumpleaños feliz Happy birthday to you Fedarcor Ricardo Casero.mp3" type="audio/mpeg">
</audio>

<!-- Botón de música -->
<button class="music-toggle" id="musicToggle" onclick="alternarMusica()">🔊</button>

<div class="main-content" id="mainContent">
  <div class="card">
    <h1 class="titulo">¡Feliz Cumpleaños, Mami!</h1>
    <p class="subtitulo">Te amamos con todo el corazón</p>
    <p class="leyenda">Gracias por ser la luz de nuestra vida, por tu paciencia infinita y por tu amor incondicional. <strong>Que pases un día hermoso.</strong></p>
    <p class="firma">Con amor eterno ❤️</p>
  </div>
</div>

<script>
  let isPlaying = false;

  function abrirSobre() {
    const envelope = document.getElementById('envelope');
    const envelopeScreen = document.getElementById('envelopeScreen');
    const mainContent = document.getElementById('mainContent');
    const musicToggle = document.getElementById('musicToggle');
    const audio = document.getElementById('backgroundAudio');

    envelope.classList.add('abierto');

    audio.play().then(() => {
      isPlaying = true;
      musicToggle.textContent = '🔊';
    }).catch(error => {
      console.log("Bloqueo de reproducción:", error);
      isPlaying = false;
      musicToggle.textContent = '🔇';
    });

    setTimeout(() => {
      envelopeScreen.classList.add('oculto');
      mainContent.classList.add('visible');
      musicToggle.classList.add('visible');
    }, 700);
  }

  function alternarMusica() {
    const audio = document.getElementById('backgroundAudio');
    const musicToggle = document.getElementById('musicToggle');

    if (isPlaying) {
      audio.pause();
      musicToggle.textContent = '🔇';
      isPlaying = false;
    } else {
      audio.play().then(() => {
        musicToggle.textContent = '🔊';
        isPlaying = true;
      }).catch(err => {
        console.log("Error al reproducir:", err);
      });
    }
  }
</script>
</body>
</html>
